<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Piedimonte 2.0 — Menù</title>
<meta name="description" content="Il menù di Piedimonte 2.0, pizzeria d'autore sul lungomare di Rodia (Messina).">
<meta name="theme-color" content="#0A0A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=EB+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div class="m-page">

  <header class="m-hero">
    <img class="m-hero-enzo" src="img/brand/enzo-linea.png" alt="" aria-hidden="true"
         width="1000" height="1049" decoding="async">
    <svg class="m-emblema" viewBox="0 0 120 132" aria-hidden="true" focusable="false">
      <!-- esagono + pizza con spicchio sollevato: omaggio al marchio del locale -->
      <path class="m-e-esagono" d="M60 4 112 34v64L60 128 8 98V34z"/>
      <path class="m-e-pizza" d="M60 26a34 34 0 1 0 0 68 34 34 0 0 0 0-68"/>
      <path class="m-e-spicchio" d="M60 60 88 44a32 32 0 0 1 5 16z"/>
      <circle class="m-e-punto" cx="48" cy="50" r="3.5"/>
      <circle class="m-e-punto" cx="70" cy="74" r="3.5"/>
      <circle class="m-e-punto" cx="47" cy="74" r="3.5"/>
      <circle class="m-e-punto" cx="59" cy="43" r="2.5"/>
    </svg>

    <div class="m-logo-mask">
      <h1 class="m-logo">
        <span class="m-logo-hash">#</span>PIEDIMONTE<span class="m-logo-ver">2.0</span>
      </h1>
    </div>
    <p class="m-sotto">Pizza d’autore</p>
    <p class="m-citazione">«Ogni pizza è un passo verso il futuro»</p>
  </header>

  <button class="m-chef" type="button">
    <span class="m-chef-testo">
      <span class="m-chef-nome">Enzo Piedimonte</span>
      <span class="m-chef-ruolo">Il pizzaiolo · la sua storia</span>
    </span>
    <span class="m-chef-premi">
      <img src="img/brand/gambero.jpg" alt="Due Spicchi Gambero Rosso" width="360" height="362" loading="lazy">
      <img src="img/brand/50top.jpg" alt="50 Top Pizza" width="360" height="360" loading="lazy">
      <img src="img/brand/sanremo.jpg" alt="Casa Sanremo" width="360" height="360" loading="lazy">
    </span>
  </button>

  <div class="m-c-box">
    <p class="m-c-occhiello">Non sai quale scegliere?</p>
    <button class="m-consiglia" type="button">
      <span class="m-c-azione">Consigliami</span>
    </button>
  </div>

  <nav class="m-nav" aria-label="Categorie"></nav>

  <main></main>

  <footer class="m-footer"></footer>

  <button class="m-pdf" type="button" aria-label="Stampa il menù in PDF">Menù in PDF</button>
</div>

<script src="dati.js"></script>
<script src="foto.js"></script>
<script src="menu.js"></script>
</body>
</html>
