<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sagrato · Visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="vendor/core.css" />
<link rel="stylesheet" href="vendor/markers-plugin.css" />
<link rel="stylesheet" href="vendor/virtual-tour-plugin.css" />
<link rel="stylesheet" href="vendor/map-plugin.css" />
<link rel="stylesheet" href="css/tour.css" />
</head>
<body>

<div id="viewer"></div>

<a class="chrome glass" id="torna" href="./">← <span>Sagrato</span></a>

<div class="chrome glass" id="insegna">
  <span class="chiesa" id="nome-chiesa"></span>
  <span class="sep"></span>
  <span class="tappa" id="nome-tappa"></span>
</div>

<nav class="chrome glass" id="tappe" aria-label="Tappe della visita"></nav>

<div class="chrome" id="comandi">
  <div id="qualita">
    <button class="tondo glass" id="btn-qualita" aria-expanded="false" title="Qualità immagine" aria-label="Qualità immagine">
      <svg viewBox="0 0 24 24"><path d="M4 17V9M9 17V5M14 17v-6M19 17V7"/></svg>
    </button>
    <div class="glass" id="menu-qualita" role="menu" hidden></div>
  </div>
  <button class="tondo glass" id="btn-pieno" title="Schermo intero" aria-label="Schermo intero">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<aside class="chrome glass" id="scheda" aria-hidden="true">
  <button id="chiudi-scheda" aria-label="Chiudi la scheda">✕</button>
  <p class="occhiello" id="scheda-occhiello"></p>
  <h2 id="scheda-titolo"></h2>
  <div id="scheda-testo"></div>
  <p class="dettagli" id="scheda-dettagli"></p>
</aside>

<div id="soglia">
  <p class="eyebrow" id="soglia-luogo"></p>
  <h1 id="soglia-nome"></h1>
  <p id="soglia-intro"></p>
  <button id="entra" disabled>Preparazione…</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "@photo-sphere-viewer/core": "./vendor/core.js"
} }
</script>
<script type="module" src="js/tour.js"></script>
</body>
</html>
